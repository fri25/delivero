<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002050" />
    <title>Hors ligne — ChapExpress</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #0b1b33; background: #f6f8fc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #dde4ee; border-radius: 24px; background: white; box-shadow: 0 20px 60px #00205012; }
      .mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; color: white; background: #002050; font-weight: 800; }
      h1 { margin: 24px 0 8px; font-size: 26px; } p { color: #5b6b82; line-height: 1.6; }
      button { min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; padding: 0 18px; color: white; background: #1070c0; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">CE</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Votre panier est conservé sur cet appareil. Reconnectez-vous pour envoyer ou suivre une commande.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
