services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivero
      POSTGRES_PASSWORD: delivero
      POSTGRES_DB: delivero
    ports:
      - "5432:5432"
    volumes:
      - delivero_pgdata:/var/lib/postgresql/data

volumes:
  delivero_pgdata:
