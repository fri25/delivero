# API + PostgreSQL derrière le Traefik déjà présent sur le serveur
# (HTTPS auto, WebSocket OK pour Socket.IO sans config suppl.).
# Les PWAs sont hébergées séparément.
#
# Prérequis (une fois, sur le serveur) : le réseau partagé doit exister —
#   docker network create proxy
# (sauter si `docker network ls` l'affiche déjà).
#
#   cd deploy && cp .env.example .env   # puis remplir les valeurs ✏️
#   ./deploy.sh
#
# Rollback / release épinglée :
#   API_IMAGE_TAG=20261029-abc123 ./deploy.sh --no-build
#
# Networks: `proxy` = réseau externe partagé avec Traefik (trafic public
# Traefik -> API) ; `chapexpress-backend` = interne (API -> PostgreSQL),
# sans route vers l'extérieur — la DB est injoignable même depuis les
# autres containers de l'hôte.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env (hex uniquement, ex. `openssl rand -hex 24`)}
      POSTGRES_DB: delivero
    # Backend network only + no published port: reachable solely by the api container.
    networks:
      - chapexpress-backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivero -d delivero"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    # Tagged so a release is rollbackable: `docker images chapexpress-api`.
    image: chapexpress-api:${API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Must stay 3000: the Traefik label below routes to api:3000.
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans deploy/.env — ex. postgresql://delivero:<POSTGRES_PASSWORD_hex>@db:5432/delivero?schema=public}
    networks:
      - proxy
      - chapexpress-backend
    labels:
      - "traefik.enable=true"
      # The api container lives on two networks: tell Traefik which one to use.
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN:?API_DOMAIN manquant dans deploy/.env}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=api-secure-headers"
      - "traefik.http.middlewares.api-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.api-secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.api-secure-headers.headers.stsPreload=true"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Fronts statiques (VITE_API_URL figée au build, servis par nginx) ----
  client:
    image: chapexpress-client:${FRONT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.front
      args:
        APP: client
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL manquant dans deploy/.env — ex. https://api.rapiliv.com/api}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.client.rule=Host(`${CLIENT_DOMAIN:?CLIENT_DOMAIN manquant}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.services.client.loadbalancer.server.port=80"
      # Apex + www -> app cliente (https://rapiliv.com/... -> https://client.rapiliv.com/...).
      # Nécessite : enregistrements A rapiliv.com et www.rapiliv.com -> IP du VPS.
      - "traefik.http.routers.client-apex.rule=Host(`rapiliv.com`) || Host(`www.rapiliv.com`)"
      - "traefik.http.routers.client-apex.entrypoints=websecure"
      - "traefik.http.routers.client-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.client-apex.middlewares=redirect-to-client"
      - "traefik.http.middlewares.redirect-to-client.redirectregex.regex=^https://(www\\.)?rapiliv\\.com/(.*)"
      - "traefik.http.middlewares.redirect-to-client.redirectregex.replacement=https://client.rapiliv.com/$${2}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  livreur:
    image: chapexpress-livreur:${FRONT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.front
      args:
        APP: livreur
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL manquant dans deploy/.env — ex. https://api.rapiliv.com/api}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.livreur.rule=Host(`${LIVREUR_DOMAIN:?LIVREUR_DOMAIN manquant}`)"
      - "traefik.http.routers.livreur.entrypoints=websecure"
      - "traefik.http.routers.livreur.tls.certresolver=letsencrypt"
      - "traefik.http.services.livreur.loadbalancer.server.port=80"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  partenaires:
    image: chapexpress-partenaires:${FRONT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.front
      args:
        APP: partenaires
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL manquant dans deploy/.env — ex. https://api.rapiliv.com/api}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.partenaires.rule=Host(`${PARTENAIRES_DOMAIN:?PARTENAIRES_DOMAIN manquant}`)"
      - "traefik.http.routers.partenaires.entrypoints=websecure"
      - "traefik.http.routers.partenaires.tls.certresolver=letsencrypt"
      - "traefik.http.services.partenaires.loadbalancer.server.port=80"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    image: chapexpress-admin:${FRONT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.front
      args:
        APP: admin
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL manquant dans deploy/.env — ex. https://api.rapiliv.com/api}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:?ADMIN_DOMAIN manquant}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Shared with the Traefik already running on the server. The name `proxy`
  # is imposed: it must match the real Traefik network exactly (attachment +
  # `traefik.docker.network` label). Must exist:
  # `docker network create proxy` (not managed by this compose).
  proxy:
    name: proxy
    external: true
  # Project-scoped name (no `deploy_` prefix surprise, no clash with the
  # `backend` networks of other stacks on the same server).
  chapexpress-backend:
    name: chapexpress-backend
    internal: true

volumes:
  pgdata:
