    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false

  - type: web
    name: chapexpress-admin
    runtime: static
    buildCommand: >-
      pnpm install --frozen-lockfile --filter @delivero/admin... &&
      pnpm --filter @delivero/admin build
    staticPublishPath: apps/admin/dist
    buildFilter:
