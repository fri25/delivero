    buildFilter:
      paths:
        - apps/livreur/**
        - packages/**
        - pnpm-lock.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false

  - type: web
    name: chapexpress-partenaires
    runtime: static
    buildCommand: >-
      pnpm install --frozen-lockfile --filter @delivero/partenaires... &&
      pnpm --filter @delivero/partenaires build
    staticPublishPath: apps/partenaires/dist
    buildFilter:
      paths:
        - apps/partenaires/**
        - packages/**
